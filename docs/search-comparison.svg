<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Hybrid search vs agentic file search</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3B2216"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="24" fill="#F6F0E9"/>

  <text x="600" y="72" text-anchor="middle" font-size="40" font-weight="700" fill="#3B2216">Two ways to find answers</text>

  <!-- Hybrid search -->
  <rect x="60" y="110" width="520" height="530" rx="20" fill="#FFFFFF" stroke="#E6D9CB" stroke-width="2"/>
  <text x="320" y="170" text-anchor="middle" font-size="34" font-weight="700" fill="#3B2216">Hybrid search</text>

  <rect x="100" y="210" width="440" height="70" rx="14" fill="#D29A63"/>
  <text x="320" y="255" text-anchor="middle" font-size="28" font-weight="600" fill="#3B2216">Question</text>
  <line x1="320" y1="284" x2="320" y2="308" stroke="#3B2216" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="100" y="316" width="440" height="70" rx="14" fill="#3B2216"/>
  <text x="320" y="361" text-anchor="middle" font-size="28" font-weight="600" fill="#F6F0E9">Vector + keyword search</text>
  <line x1="320" y1="390" x2="320" y2="414" stroke="#3B2216" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="100" y="422" width="440" height="70" rx="14" fill="#3B2216"/>
  <text x="320" y="467" text-anchor="middle" font-size="28" font-weight="600" fill="#F6F0E9">Merge results</text>
  <line x1="320" y1="496" x2="320" y2="520" stroke="#3B2216" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="100" y="528" width="440" height="70" rx="14" fill="#D29A63"/>
  <text x="320" y="573" text-anchor="middle" font-size="28" font-weight="600" fill="#3B2216">Answer</text>

  <!-- Agentic file search -->
  <rect x="620" y="110" width="520" height="530" rx="20" fill="#FFFFFF" stroke="#E6D9CB" stroke-width="2"/>
  <text x="880" y="170" text-anchor="middle" font-size="34" font-weight="700" fill="#3B2216">Agentic file search</text>

  <rect x="660" y="210" width="440" height="70" rx="14" fill="#D29A63"/>
  <text x="880" y="255" text-anchor="middle" font-size="28" font-weight="600" fill="#3B2216">Question</text>
  <line x1="880" y1="284" x2="880" y2="308" stroke="#3B2216" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="660" y="316" width="440" height="176" rx="14" fill="#3B2216"/>
  <text x="880" y="392" text-anchor="middle" font-size="28" font-weight="600" fill="#F6F0E9">Agent lists, searches</text>
  <text x="880" y="432" text-anchor="middle" font-size="28" font-weight="600" fill="#F6F0E9">and reads files</text>
  <line x1="880" y1="496" x2="880" y2="520" stroke="#3B2216" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="660" y="528" width="440" height="70" rx="14" fill="#D29A63"/>
  <text x="880" y="573" text-anchor="middle" font-size="28" font-weight="600" fill="#3B2216">Answer</text>

  <text x="600" y="705" text-anchor="middle" font-size="30" font-weight="600" fill="#3B2216">Same documents, same permissions, same answer model.</text>
</svg>
